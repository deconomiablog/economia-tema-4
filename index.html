if(kind==='unit'){let points=[];for(let q=1000/110;q<=50;q+=.2)points.push(`${x(q)},${y(1000/q)}`);svg+=`<polyline points="${points.join(' ')}" fill="none" stroke="${blue}" stroke-width="3"/>`}
if(kind==='vertical')svg+=`<path d="M${x(5000)} 40V270" stroke="${green}" stroke-width="4"/><text x="${x(5000)+10}" y="55" fill="${green}">O</text><text x="${x(5000)}" y="309" text-anchor="middle" font-size="13">5.000</text>`;
pts.forEach(([q,p,label])=>{svg+=`<path d="M60 ${y(p)}H${x(q)}V270" stroke="#748b98" stroke-dasharray="3 4" fill="none"/><circle cx="${x(q)}" cy="${y(p)}" r="5" fill="#16344b"/><text x="${x(q)+10}" y="${y(p)-10}" font-size="14" font-weight="bold">${label}</text>`});
if(kind==='surplus'||kind==='shortage'){let p=kind==='surplus'?20:10,qD=500-20*p,qO=20*p-100;svg+=`<path d="M60 ${y(p)}H500" stroke="#ae4136" stroke-dasharray="3 4"/><path d="M${x(qD)} ${y(p)}H${x(qO)}" stroke="#ae4136" stroke-width="5"/><text x="345" y="${y(p)-8}" font-size="13" fill="#ae4136">P = ${p} €</text>`}
return `<figure class="graph">${svg}</svg><figcaption>${caption}</figcaption></figure>`}
function focusMain(){$('#app').focus();window.scrollTo(0,0)}
function stats(b){const a=BANK.filter(q=>b===undefined||q.b===b);return {total:a.length,seen:a.filter(q=>db.records[q.id]).length,ok:a.filter(q=>db.records[q.id]?.ok===true).length}}
function home(){session=null;const s=stats();$('#app').innerHTML=`<section class="hero"><div><span class="eyebrow">Tema 4 · Laboratorio de mercado</span><h1>Entender el mercado.<br>Una decisión cada vez.</h1><p class="muted">¿Se mueve un punto o toda la curva? ¿Qué cambia en el equilibrio? Practica, descubre por qué te equivocas y vuelve a intentarlo.</p><div class="chips"><span class="chip">60 preguntas explicadas</span><span class="chip">5 bloques</span><span class="chip">A tu ritmo</span></div></div><div class="hero-art">${graph('eq')}<p>Compradores y vendedores. Un mismo mercado.</p></div></section><div class="toolbar"><div><label for="mode">Cómo quieres practicar</label><select id="mode"><option value="learn">Aprender · pistas y explicación inmediata</option><option value="practice">Practicar · sin pistas, corrección inmediata</option><option value="exam">Comprobarme · corrección al terminar</option></select></div><button class="primary" id="mixed">Sesión mixta · 15 preguntas</button><button id="errors" ${BANK.some(q=>db.records[q.id]?.ok===false)?'':'disabled'}>Repasar errores</button></div>${db.session?'<div class="note"><b>Tienes una sesión pendiente.</b> <button id="resume">Continuar sesión</button></div>':''}<h2>Tu recorrido</h2><p class="muted">${s.seen} de 60 preguntas contestadas · ${s.ok} correctas en el último intento. Cada barra cuenta preguntas distintas; repetir una no añade otra.</p><div class="cards">${BLOCKS.map(([name,desc],b)=>{let st=stats(b);return `<article class="card"><span class="number">BLOQUE 0${b+1} · 12 PREGUNTAS</span><h3>${name}</h3><p class="muted">${desc}</p><div class="meter" role="progressbar" aria-label="Correctas en ${name}" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${st.ok}"><span style="width:${st.ok/12*100}%"></span></div><p><b>${st.ok}/12</b> correctas · ${st.seen}/12 contestadas</p><button data-block="${b}">Practicar ${name.toLowerCase()}</button></article>`}).join('')}<article class="card" style="background:#e2eeeb"><span class="number">CÓMO USARLO</span><h3>Explica antes de elegir</h3><p>Haz los cálculos en papel. En las preguntas gráficas, identifica primero el factor que cambia. Usa las explicaciones para revisar tu razonamiento.</p><p>Convención: en los cálculos de elasticidad usamos porcentajes respecto a los valores iniciales y valor absoluto para la demanda.</p></article></div><div class="note">El progreso pertenece a <b>este navegador</b>, no se comparte con el profesorado ni se sincroniza entre dispositivos. Los resultados orientan tu repaso; no certifican por sí solos que domines un concepto.</div><div class="actions"><button id="export">Descargar mi progreso</button><button id="reset">Borrar mi progreso</button></div>`;$('#mode').value=mode;$('#mode').onchange=e=>mode=e.target.value;$('#mixed').onclick=()=>start(shuffle(BLOCKS.flatMap((_,b)=>shuffle(BANK.filter(q=>q.b===b)).slice(0,3))).map(q=>q.id));$('#errors').onclick=()=>start(shuffle(BANK.filter(q=>db.records[q.id]?.ok===false)).map(q=>q.id));document.querySelectorAll('[data-block]').forEach(btn=>btn.onclick=()=>start(shuffle(BANK.filter(q=>q.b===+btn.dataset.block)).map(q=>q.id)));if($('#resume'))$('#resume').onclick=()=>{session=db.session;mode=session.mode;renderQuestion()};$('#export').onclick=download;$('#reset').onclick=()=>{if(confirm('¿Borrar todo el progreso y la sesión pendiente de este navegador?')){db={records:{},session:null};save();home()}};focusMain()}
function start(ids){if(!ids.length)return;if(db.session&&!confirm('Tienes una sesión pendiente. ¿Sustituirla por esta nueva sesión?'))return;session={ids,index:0,answers:[],mode,orders:{}};ids.forEach(id=>{const q=BANK.find(q=>q.id===id);if(q.options)session.orders[id]=shuffle(q.options.map((_,i)=>i))});db.session=session;save();renderQuestion()}
function current(){return BANK.find(q=>q.id===session.ids[session.index])}
function renderQuestion(){const q=current(),old=session.answers[session.index];done=!!old;selected=old?.value??null;const orders=session.orders?.[q.id]||q.options?.map((_,i)=>i);$('#app').innerHTML=`<section class="panel"><div class="quiztop"><span>${esc(BLOCKS[q.b][0])} · ${esc(q.topic)}</span><b>${session.index+1} / ${session.ids.length}</b></div><div class="meter"><span style="width:${session.index/session.ids.length*100}%"></span></div><p class="eyebrow">${{learn:'Aprender',practice:'Practicar',exam:'Comprobarme'}[session.mode]}</p><h1 class="question">${esc(q.text)}</h1>${q.graph?graph(q.graph):''}<form id="answerForm">${q.options?`<div class="options" role="group" aria-label="Elige una respuesta">${orders.map((i,j)=>`<button type="button" class="option" data-option="${i}" aria-pressed="${selected===i}" ${done?'disabled':''}><span class="letter">${String.fromCharCode(65+j)}</span><span>${esc(q.options[i])}</span></button>`).join('')}</div>`:`<label for="numeric">Tu respuesta (${esc(q.unit)})</label><input id="numeric" class="answerinput" inputmode="decimal" type="text" autocomplete="off" value="${old?esc(old.value):''}" ${done?'disabled':''}><small>Admite coma o punto decimal. Sin separadores de miles; redondea a dos decimales si es necesario.</small>`}<p id="error" class="error" role="alert"></p><div class="actions"><button class="primary" type="submit" id="check" ${done?'hidden':''}>${session.mode==='exam'?'Guardar respuesta':'Comprobar respuesta'}</button>${session.mode==='learn'?'<button type="button" id="hintBtn">Ver pista</button>':''}<button type="button" id="next" ${done?'':'hidden'}>${session.index+1===session.ids.length?'Ver resultados':'Siguiente pregunta →'}</button></div></form><div id="hint" class="note" hidden></div><div id="feedback" aria-live="polite"></div><p class="muted"><small>Las respuestas se guardan al comprobarlas. Puedes volver al inicio y continuar esta sesión.</small></p></section>`;document.querySelectorAll('[data-option]').forEach(btn=>btn.onclick=()=>{if(done)return;selected=+btn.dataset.option;document.querySelectorAll('[data-option]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.option===selected)))});$('#answerForm').onsubmit=e=>{e.preventDefault();submit()};if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hint').hidden=false;$('#hint').textContent=q.hint};$('#next').onclick=next;if(old)feedback(q,old);focusMain()}
function numericValue(raw){raw=raw.trim().replace(',','.');return /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw)?Number(raw):null}
function submit(){if(done)return;const q=current();let value=q.options?selected:numericValue($('#numeric').value);if(value===null||!Number.isFinite(value)){$('#error').textContent=q.options?'Elige una respuesta antes de continuar.':'Escribe un número válido, sin unidades ni separadores de miles.';return}const ok=q.options?value===q.correct:Math.abs(value-q.answer)<=.005;const a={id:q.id,value,ok};session.answers[session.index]=a;db.records[q.id]={ok,attempts:(db.records[q.id]?.attempts||0)+1,date:new Date().toISOString()};db.session=session;save();renderQuestion()}
function correctText(q){return q.options?q.options[q.correct]:`${q.answer.toLocaleString('es-ES')} ${q.unit}`}
function chosenText(q,a){return q.options?q.options[a.value]:`${Number(a.value).toLocaleString('es-ES')} ${q.unit}`}
function feedback(q,a){if(session.mode==='exam'){$('#feedback').innerHTML='<div class="note">Respuesta guardada. Verás la corrección al terminar la sesión.</div>';return}$('#feedback').innerHTML=`<div class="feedback ${a.ok?'':'wrong'}"><h3>${a.ok?'Correcto. Este es el razonamiento:':'Revisa el razonamiento'}</h3>${a.ok?'':`<p>Has respondido: <b>${esc(chosenText(q,a))}</b></p><p>Respuesta correcta: <b>${esc(correctText(q))}</b></p>`}<p>${esc(q.why)}</p></div>`}
function next(){if(!done)return;if(session.index+1===session.ids.length){results();return}session.index++;db.session=session;save();renderQuestion()}
function results(){const answers=[...session.answers],ids=[...session.ids],correct=answers.filter(a=>a.ok).length;db.session=null;save();$('#app').innerHTML=`<section class="panel"><span class="eyebrow">Sesión completada</span><h1>${correct} de ${answers.length}<br>Un paso más para entenderlo.</h1><p>Revisa las explicaciones y vuelve a los conceptos que necesitan más práctica.</p><div class="report">${BLOCKS.map(([name],b)=>{const aa=answers.filter(a=>BANK.find(q=>q.id===a.id).b===b);return `<div>${name}<strong>${aa.length?aa.filter(a=>a.ok).length+'/'+aa.length:'—'}</strong>${aa.length?'en esta sesión':'sin preguntas'}</div>`}).join('')}</div><h2>Qué conviene repasar</h2><p>${answers.some(a=>!a.ok)?esc([...new Set(answers.filter(a=>!a.ok).map(a=>BANK.find(q=>q.id===a.id).topic))].join(' · ')):'Has acertado todas las preguntas de esta sesión. Prueba otros bloques y explica las respuestas con tus propias palabras.'}</p><div class="actions"><button id="back" class="primary">Volver a los bloques</button><button id="retry" ${correct===answers.length?'disabled':''}>Repetir errores de esta sesión</button></div><h2>Tus respuestas, explicadas</h2>${answers.map(a=>{const q=BANK.find(q=>q.id===a.id);return `<details><summary>${a.ok?'✓ Correcta':'↺ Para repasar'} · ${esc(q.topic)}</summary><p><b>${esc(q.text)}</b></p><p>Tu respuesta: ${esc(chosenText(q,a))}</p><p>Respuesta correcta: <b>${esc(correctText(q))}</b></p><p>${esc(q.why)}</p>${q.graph?graph(q.graph):''}</details>`}).join('')}</section>`;$('#back').onclick=home;$('#retry').onclick=()=>{mode='learn';start(answers.filter(a=>!a.ok).map(a=>a.id))};session=null;focusMain()}
function download(){const text=['MI REPASO · TEMA 4',new Date().toLocaleString('es-ES'),'Resultados del último intento por pregunta. No son una calificación oficial.','',...BLOCKS.flatMap(([name],b)=>{const st=stats(b);return [name+': '+st.ok+'/12 correctas, '+st.seen+'/12 contestadas',...BANK.filter(q=>q.b===b).map(q=>`${q.id}. ${q.topic}: ${db.records[q.id]?(db.records[q.id].ok?'correcta':'para repasar'):'sin contestar'}`),'']})].join('\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='mi-progreso-tema-4.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#homeBtn').onclick=home;home();
</script></body></html>
